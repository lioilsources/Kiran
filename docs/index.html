<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiran — Space Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      color: #e0e0ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 60px 24px;
    }
    h1 { font-size: 3rem; letter-spacing: 0.1em; color: #a0c8ff; margin-bottom: 12px; }
    .subtitle { font-size: 1.2rem; color: #8888aa; margin-bottom: 48px; }
    .description {
      max-width: 600px;
      text-align: center;
      line-height: 1.7;
      font-size: 1rem;
      color: #c0c0e0;
      margin-bottom: 48px;
    }
    .badges { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-bottom: 48px; }
    .badge {
      display: inline-block;
      background: #1a1a3a;
      border: 1px solid #3a3a6a;
      border-radius: 8px;
      padding: 10px 20px;
      color: #a0c8ff;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .badge:hover { border-color: #a0c8ff; }
    footer { margin-top: auto; padding-top: 40px; color: #555577; font-size: 0.85rem; }
    footer a { color: #7777aa; text-decoration: none; }
    footer a:hover { color: #a0c8ff; }
  </style>
</head>
<body>
  <h1>KIRAN</h1>
  <p class="subtitle">Vertical Space Shooter</p>
  <p class="description">
    A fast-paced vertical-scrolling space shooter for iOS and Android.
    Pilot your ship through waves of enemies, upgrade weapons, and survive
    increasingly intense sectors.
  </p>
  <div class="badges">
    <a class="badge" href="https://apps.apple.com/app/kiran">App Store</a>
    <a class="badge" href="https://play.google.com/store/apps/details?id=com.ol1n.kiran">Google Play</a>
  </div>
  <footer>
    <a href="privacy.html">Privacy Policy</a> &nbsp;·&nbsp;
    &copy; 2025 ol1n
  </footer>
</body>
</html>
