# Builds Windows + Linux and uploads both depots to Steam as a new build.
#
# Runs only when the Steam secrets exist (the `deploy` job is skipped
# otherwise), so this workflow is safe to merge before the Steamworks account
# is set up. Required secrets:
#   STEAM_APP_ID          — numeric app id from Steamworks
#   STEAM_BUILD_USERNAME  — dedicated build account (Edit App Metadata +
#                           Publish App Changes only)
#   STEAM_CONFIG_VDF      — base64 of config/config.vdf after a local
#                           `steamcmd +login <user>` (Steam Guard handshake)
#
# Depot layout (Steamworks defaults): <APPID+1> = windows, <APPID+2> = linux.
#
# A tag push uploads the build without promoting it. Setting it live on
# `default` from here fails: v3.9.3 uploaded both depots and then died on
# "Failed to commit build" twice, while the same tag run upload-only went
# through. Promote `default` by hand (below).
#
# A branch can only be named once it exists, and Steam creates none before
# `default` has a build: a workflow naming a branch on a fresh app fails with
# "Failed to commit build" while the depots upload perfectly, which is how v3.6.1
# failed twice. `default` has had a build since v3.9.1, so this is safe now.
# game-ci/steam-deploy only passes `--branch` when releaseBranch is non-empty
# (see its src/build-cli-args.ts); an empty value is the upload-only mode.
#
# Run by hand with releaseBranch set to promote to another branch, or empty to
# upload without promoting. Manual promotion: Steamworks → SteamPipe → Buildy,
# pick the build, "Aktivovat build na větvi".
name: Steam Deploy

on:
  push:
    # Steam ships the 3.x line only. The 2.x tags (release/2.9.x) are the
    # mobile store builds and must never reach a depot.
    tags:
      - 'v3.*'
  workflow_dispatch:
    inputs:
      releaseBranch:
        description: 'Steam branch to set live on (empty = upload only, no promotion)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows depot
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: tyrian_mobile
        run: flutter pub get

      - name: Stamp version from tag
        shell: bash
        working-directory: tyrian_mobile
        run: |
          BASE="${GITHUB_REF_NAME#v}"
          echo "$BASE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || BASE=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          sed -i -E "s/^version: .*/version: ${BASE}+${GITHUB_RUN_NUMBER}/" pubspec.yaml

      - name: Build Windows (release)
        working-directory: tyrian_mobile
        run: flutter build windows --release --dart-define=TELEMETRY_KEY=${{ secrets.TELEMETRY_KEY }} --dart-define=TELEMETRY_HOST=${{ secrets.TELEMETRY_HOST }}
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - uses: actions/upload-artifact@v4
        with:
          name: steam-depot-windows
          path: tyrian_mobile/build/windows/x64/runner/Release/
          if-no-files-found: error

  build-linux:
    name: Build Linux depot
    # Pinned, not `ubuntu-latest`: the build host's glibc becomes the depot's
    # minimum. 24.04 means glibc 2.39, which covers SteamOS and every current
    # desktop distro. Letting `latest` drift to the next LTS would quietly
    # raise that floor under players who are already running the game, so this
    # moves only when we decide it does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config cmake clang
          # libmpv is the audio backend (media_kit); nothing in pub bundles it,
          # so we install it here only to copy it into the depot below.
          sudo apt-get install -y libmpv2 || sudo apt-get install -y libmpv1

      - run: flutter config --enable-linux-desktop

      - name: Install dependencies
        working-directory: tyrian_mobile
        run: flutter pub get

      - name: Stamp version from tag
        working-directory: tyrian_mobile
        run: |
          BASE="${GITHUB_REF_NAME#v}"
          echo "$BASE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || BASE=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          sed -i -E "s/^version: .*/version: ${BASE}+${GITHUB_RUN_NUMBER}/" pubspec.yaml

      - name: Build Linux (release)
        working-directory: tyrian_mobile
        run: flutter build linux --release --dart-define=TELEMETRY_KEY=${{ secrets.TELEMETRY_KEY }} --dart-define=TELEMETRY_HOST=${{ secrets.TELEMETRY_HOST }}

      # Without this the depot has no audio backend at all on a machine that
      # happens not to ship libmpv, which is most of them.
      - name: Bundle libmpv into the depot
        working-directory: tyrian_mobile
        run: tool/bundle_linux_libmpv.sh build/linux/x64/release/bundle

      # Steam launches the raw bundle binary directly (launch option: kirian);
      # the AppImage from release-linux.yml is for direct download only.
      - uses: actions/upload-artifact@v4
        with:
          name: steam-depot-linux
          path: tyrian_mobile/build/linux/x64/release/bundle/
          if-no-files-found: error

  deploy:
    name: Upload depots to Steam
    needs: [build-windows, build-linux]
    # Pinned: on the ubuntu-26.04 image (ubuntu-latest since late Oct 2026)
    # steamcmd inside game-ci's container fails its first self-update with
    # "Steamcmd needs to be online to update", on every run. 24.04 is the
    # image the last successful upload (v3.7.0) ran on.
    runs-on: ubuntu-24.04
    # Skip cleanly until the Steamworks secrets are configured.
    if: ${{ vars.STEAM_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: steam-depot-windows
          path: steam-build/windows

      - uses: actions/download-artifact@v4
        with:
          name: steam-depot-linux
          path: steam-build/linux

      # upload-artifact keeps no file modes — every file comes back 644, so
      # without this the Linux depot ships a `kirian` Steam cannot execute.
      - name: Restore executable bit on the Linux binary
        run: chmod +x steam-build/linux/kirian

      # Pinned: v3.2.2 (2026-11-04, what @v3 now resolves to) rewrote the action
      # to download the game-ci CLI through the GitHub API, which answers the
      # unauthenticated runner with 403 ("Failed to resolve the latest game-ci
      # CLI release"). v3.2.1 is the Docker action the 24.04 fix was proven on.
      - uses: game-ci/steam-deploy@v3.2.1
        with:
          username: ${{ secrets.STEAM_BUILD_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ secrets.STEAM_APP_ID }}
          buildDescription: ${{ github.ref_name }} (run ${{ github.run_number }})
          rootPath: steam-build
          depot1Path: windows
          depot2Path: linux
          # Tag push: no inputs, so upload only. Manual run: whatever was typed,
          # empty = upload only. See the header.
          releaseBranch: ${{ inputs.releaseBranch }}
