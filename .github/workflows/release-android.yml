name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Rebuild this existing tag (e.g. v3.9.3) and attach the AAB/APK to its release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Release Android
    runs-on: ubuntu-latest
    env:
      # The tag being released: the pushed tag, or the one typed into a manual run.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned like ci.yml and the desktop releases: 3.50 needs Gradle 9.3.1.
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: tyrian_mobile
        run: flutter pub get

      - name: Bump build number
        working-directory: tyrian_mobile
        run: |
          # Version comes from the release tag (v2.2.3 → 2.2.3); pubspec is only a fallback.
          BASE="${RELEASE_TAG#v}"
          echo "$BASE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || BASE=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          NEW="${BASE}+${{ github.run_number }}"
          sed -i -E "s/^version: .*/version: ${NEW}/" pubspec.yaml
          echo "Build version: ${NEW}"

      - name: Create keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo -n "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > tyrian_mobile/android/app/release.keystore
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > tyrian_mobile/android/key.properties

      - name: Build release AAB
        working-directory: tyrian_mobile
        run: flutter build appbundle --release

      - name: Build release APK
        working-directory: tyrian_mobile
        run: flutter build apk --release

      - name: Verify APK signing certificate
        run: |
          APK="tyrian_mobile/build/app/outputs/flutter-apk/app-release.apk"
          echo "=== APK signing certificate ==="
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -20

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tyrian_mobile/build/app/outputs/bundle/release/app-release.aab
            tyrian_mobile/build/app/outputs/flutter-apk/app-release.apk
          name: Kiran ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: true

      # Testers install from Firebase, where Play Billing never works, so the
      # APK they get unlocks every skin. Built after the GitHub upload: it
      # overwrites app-release.apk, and the public APK must stay gated.
      - name: Build tester APK (all skins unlocked)
        working-directory: tyrian_mobile
        run: flutter build apk --release --dart-define=TESTER_UNLOCK=true

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: Alfa
          releaseNotes: "Kiran ${{ env.RELEASE_TAG }} (build ${{ github.run_number }})"
          file: tyrian_mobile/build/app/outputs/flutter-apk/app-release.apk
